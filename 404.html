  <script>

        if (v && typeof v.quando === 'number' && Date.now() - v.quando < 31536000000) {
          gtag('consent', 'update', {
            analytics_storage: v.statistica ? 'granted' : 'denied',
            ad_storage: v.marketing ? 'granted' : 'denied',
            ad_user_data: v.marketing ? 'granted' : 'denied',
            ad_personalization: v.marketing ? 'granted' : 'denied'

        }

      if (!/(^|\.)agriturismobeatilla\.it$/.test(location.hostname)) return;
      window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-MW9C4HL';
      document.head.appendChild(s);
